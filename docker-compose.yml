services:
  apt-cacher:
    build:
      context: .
      dockerfile: docker/apt-cacher-ng/Dockerfile
    ports:
      - "3142:3142"
    volumes:
      - ./tmp/apt-cacher/cache:/var/cache/apt-cacher-ng
      - ./tmp/apt-cacher/logs:/var/log/apt-cacher-ng
      - ./docker/apt-cacher-ng/20-ipv4.conf:/etc/apt-cacher-ng/20-ipv4.conf:ro
    restart: unless-stopped

  iso-local-conf-viewer:
    image: python:3-alpine
    # Sirve el canal de updates.
    command: python3 -m http.server 8081 --directory /work
    ports:
      - "8081:8081"
    volumes:
      - ./remote:/work/remote:ro
      - ./tmp/updates:/work/updates:ro
    restart: unless-stopped
