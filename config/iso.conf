#!/usr/bin/env bash

# Build identity
ISO_NAME="icpc-bolivia-debian"
ARCH="amd64"

# Base system
DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://security.debian.org/debian-security"
DEBIAN_COMPONENTS="main contrib non-free non-free-firmware"

# Branding
META_DISTRO_ID="icpc-bolivia-debian"
META_DISTRO_NAME="ICPC Bolivia Debian"
META_DISTRO_VERSION="13"

# Paths
PROJECT_TMP_DIR="${PROJECT_DIR}/tmp"
OUTPUT_DIR="${PROJECT_TMP_DIR}/output"
UPDATES_DIR="${PROJECT_TMP_DIR}/updates"
WORK_DIR="${PROJECT_TMP_DIR}/work"
DOWNLOAD_CACHE_DIR="${PROJECT_TMP_DIR}/download-cache"
APT_CACHE_DIR="${PROJECT_TMP_DIR}/apt-cache"
DOWNLOAD_CONNECTIONS="8"
OUTPUT_RUNTIME="0"

# Local VM test defaults
DISK_SIZE_GB="20"
VM_NAME="icpc-bolivia-debian"
LAB_DISK_PATH="${PROJECT_TMP_DIR}/libvirt/images/icpc-bolivia-debian-lab-hdd.qcow2"
WIN_XP_DISK="${PROJECT_DIR}/Windows XP.qcow2"
WIN_XP_VM_NAME="icpc-winxp-lab"
ISO_PATH=""

# Runtime folder found by initramfs and GRUB
CONTEST_DIR="icpc_bo"
ROOT_SQUASH_NAME="filesystem.squashfs"

UPDATE_MANIFEST_URL=""
UPDATE_CHECK_ON_BOOT="false"
UPDATE_SIGNATURE_PUBKEY="/usr/share/contest/keys/update-signing.pub"
UPDATE_SIGNATURE_PUBKEY_FILE=""
UPDATE_SIGNING_PRIVATE_KEY_FILE=""
RUNTIME_VERSION="dev"
AUTH_SERVICE_URL="https://login.codi.com.bo/login"
AUTH_SERVICE_TIMEOUT="20"
OPT_CONTEST_DIR="/opt/icpc"
ICP_REPORT_URL="https://stats.codi.com.bo/report"
ICP_REPORT_TIMEOUT="20"
STATS_LOG_SINCE="5 minutes ago"
STATS_REPORT_ON_BOOT="2min"
STATS_REPORT_INTERVAL="5min"

# Contest security policy. Secrets and site-specific endpoints belong in the
# gitignored config/iso.local.conf, never in this public defaults file.
GRUB_ADMIN_PASSWORD_HASH='grub.pbkdf2.sha512.10000.C601EB1EB5191D4C631F03A075AF5093E2985DA28E3FFFD10E81F095E0FA19C3000995D7A44B29E6937538E5EF1502C2D733EA228E7A1B5C8A83B6176098A6AC.2214865EE3983DB51C2ACF9B585E659AC9A24FF0C23953E1D2C6CF2F3264BB84057B8B409519BA46FD16D505AC37D76238872F28D889A37982242E74D5412F24'
#GRUB_ADMIN_PASSWORD_HASH=""
TEAM_ID_REQUIRED="true"

# System defaults
DESKTOP_PROFILE="${DESKTOP_PROFILE:-gnome}"
HOSTNAME="contest"
LOCALE="en_US.UTF-8"
SUPPORTED_LOCALES="en_US.UTF-8 es_ES.UTF-8 es_BO.UTF-8"
TIMEZONE="America/La_Paz"
DEFAULT_USER="icpc"
# Credencial de escritorio conocida (convención ICPC). No es un secreto: el
# equipo entra por autologin y esto solo es el respaldo manual para el staff.
# Lo importante (GRUB, sudo, SSH) está endurecido aparte.
DEFAULT_PASSWORD="${DEFAULT_PASSWORD:-icpc}"
ENABLE_AUTOLOGIN="true"
DEFAULT_BROWSER_URL="file:///usr/share/doc/contest/index.html"
GNOME_INPUT_SOURCES="[('xkb', 'latam'), ('xkb', 'us')]"
MIN_RAM_MB=""

# Keyboard layout (X11/GNOME + console)
# Use 'latam' for Spanish Latin American, 'es' for Spain, 'us' for US, etc.
KEYBOARD_LAYOUT="latam"

# Optional proxy, IP of the host. Overridable por entorno / iso.local.conf
# (start.sh lo vacía si el caché no arranca, para no abortar el build).
APT_PROXY="${APT_PROXY:-http://192.168.122.1:3142}"

# Local deployment values may include password hashes, private-key source
# paths and endpoints. This file is intentionally ignored by Git.
if [[ -n "${PROJECT_DIR:-}" && -r "${PROJECT_DIR}/config/iso.local.conf" ]]; then
    # shellcheck source=/dev/null
    source "${PROJECT_DIR}/config/iso.local.conf"
fi
